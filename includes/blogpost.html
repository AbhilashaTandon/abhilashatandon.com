<a href={url}
  class="basis-0 grow-0 shrink-0 flex flex-col justify-start border-1 border-(--text) align-center content-center rounded-lg overflow-hidden hover:expand blogpost max-xl:w-full ">
  <div class="flex content-center align-center image-container">
    <img src="{image}" class="max-h-90 h-min object-cover w-full" alt="{alt}">
  </div>
  <div class="h-px bg-(--text) w-full" id="white-bar"></div>
  <div class="flex flex-col flex-nowrap items-start content-stretch justify-start gap-8 p-8 blogpost-metadata">
    <div class="flex flex-col flex-nowrap items-start content-stretch justify-between gap-4">
      <h1 class="h5">{post_title}</h1>
      <h2 class="p expandable">{post_excerpt}</h2>
      <h3 class="small expandable">{post_date}</h3>
    </div>
    <!-- <div class="flex flex-col flex-nowrap items-start content-stretch justify-between gap-4 expandable" -->
    <!--   id="tags"> -->
    <!-- </div> -->
  </div>
</a>

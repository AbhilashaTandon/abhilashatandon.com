<div
  class="flex flex-col flex-nowrap items-center content-stretch justify-start gap-(--xs) min-h-(--container-md) fit-width">
  <div class="flex image-container relative min-h-(--container-md) fit-width">
    <img src="{image}" class="absolute object-cover border-2 border-(--text) h-(--container-md) fit-width"
      alt="{alt}" />
    <div class="absolute flex items-center justify-center fit-width h-full">
      <h3 class="h3 text-(--dark-text)" style="text-shadow: 0 0 24px var(--background)">{label}</h3>
    </div>
  </div>
  <h4 class="h5 relative px-(--xs) "><em>{desc}</em></h4>
</div>

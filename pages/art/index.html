<layout title="Home Page" src="blogpost.html">
  <main
    class="content flex flex-col py-16 px-(--xl) items-center justify-start fit-width h-max bg-gradient-to- from-(--background)/0 to-(--background)"
    id="main">
    <div class="flex flex-col gap-y-16 max-lg:gap-8 items-left justify-between ">
      <div href="/art/{post.slug}"
        class="flex content-center align-center max-w-4xl h-max min-w-3xl min-h-xl max-lg:min-w-2 max-md:max-w-lg">
        <img src="/assets/images/{frontmatter.image}"
          class="h-max object-cover fit-width border border-(--text) rounded-lg" />
      </div>
      <div class="px-16 max-md:px-8 flex flex-col gap-y-6">
        <header class="max-lg:max-w-2xl lg:w-2xl flex flex-col items-start gap-y-6 max-md:gap-y-4">
          <h1 class="h4">{frontmatter.title}</h1>
          <div class="flex flex-row fit-width justify-between items-center">
            <h3 class="small">{frontmatter.date}</h3>
          </div>

        </header>
        <article class=" max-lg:max-w-2xl lg:w-2xl flex flex-col gap-y-8 items-start justify-between">
          {content}
        </article>
      </div>
    </div>
  </main>
</layout>

<layout title="Home Page" src="main.html">
  <main
    class="content flex flex-col px-(--xl) items-center justify-start fit-width h-max bg-gradient-to- from-(--background)/0 to-(--background)"
    id="main">
    <div id="hero"
      class="flex flex-row items-center justify-between fit-width h-max max-md:flex-col-reverse gap-y-(--medium) gap-x-(--xs) z-2">
      <div id="hero_text" class="flex flex-col gap-y-4 gap-x-8 items-start justify-start w-fit h-max">
        <h1 class="h4">Hi! I&rsquo;m</h1>
        <h1 class="h1 accent">Abhilasha Tandon</h1>
        <h2 class="h5">I like to make fun and interesting things with code.</h2>
      </div>
      <img src="/assets/images/hero_graphic.svg"
        class="h-fit w-min overflow-hidden max-lg:w-fit max-lg:h-min lg:max-xl:hidden"
        alt="Vector art of woman using a laptop" />

    </div>
    <ForEach collection="interests" as="interest">
      <include src="./interest.html" label="{interest.label}" image="{interest.image}" desc="{interest.desc}"></include>
    </ForEach>
    <div id="blog" class="flex flex-col gap-(--small) items-start justify-start fit-width h-max max-sm:gap-16 z-3">

      <h3 class="h4">My Ramblings</h3>

      <div id="blogposts"
        class="items-start content-stretch justify-between gap-y-(--small) gap-x-15 blogpost_grid max-lg:fit-width max-sm:gap-y-16">
        <ForEach content="blog" as="post" orderBy="date,desc" count="3">
          <If condition="{post.active}">
            <include src="./blogpost.html" url="/blog/{post.slug}" image="/assets/images/{post.image}"
              post_title={post.title} post_excerpt={post.excerpt} post_date={post.date} alt={post.alt}></include>
          </If>
        </ForEach>
      </div>
    </div>

    <!-- <div id="contact" class="flex flex-col flex-nowrap items-start content-stretch justify-start gap-(--small) fit-width"> -->
    <!--   <h3 class="h3">Find Me On...</h3> -->
    <!--   <div -->
    <!--     class="grid grid-cols-3 items-center content-stretch justify-between justify-items-center gap-(--small) fit-width"> -->
    <!--     <ForEach collection="socials" as="social"> -->
    <!--       <a href={social.link} class="max-w-72 max-h-32 flex items-center justify-center"> -->
    <!--         <img src={social.image} /> -->
    <!--       </a> -->
    <!--     </ForEach> -->
    <!--   </div> -->
    <!-- </div> -->

  </main>

  <img src="/assets/images/swoosh.svg" class="absolute fit-width max-lg:w-fit top-96 z-1 max-2xl:hidden lg:block"
    alt="Purple wave shaped background gradient">
</layout>
